<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Union v8.2 Bilingual</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
*{font-family:Tajawal,sans-serif}
.gold-text{background:linear-gradient(90deg,#d4af37,#f9e076,#d4af37); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-family:Cinzel,serif; letter-spacing:1.2px; text-shadow:0 0 15px rgba(212,175,55,0.4);}
</style>
</head>
<body class="bg-[#eef2f7]">
<div id="login" class="max-w-[400px] mx-auto min-h-screen flex flex-col p-6 bg-white relative">
<div class="flex justify-end"><button onclick="toggleLang()" id="langBtn" class="bg-[#0b2a5a] text-white px-4 py-1.5 rounded-full text-[11px] font-bold">ENGLISH</button></div>
<div class="flex-1 flex flex-col justify-center">
<h1 class="font-extrabold text-xl text-center" id="loginTitle">UNION SCHOOL</h1><p class="text-center text-[11px] opacity-60 mt-1" id="loginSub">نظام إدارة المدرسة</p>
<div class="mt-10 space-y-3">
<input id="loginPin" type="password" placeholder="ادخل كود الدخول / Enter PIN" class="w-full p-4 border rounded-xl text-center text-lg tracking-widest bg-slate-50">
<button onclick="doLogin()" id="loginBtn" class="w-full bg-[#0b2a5a] text-white p-4 rounded-xl font-bold shadow-lg">دخول / Login</button>
</div>
</div>
<div class="mt-auto pt-8 pb-2 text-center"><div class="w-12 h-[2px] bg-gradient-to-r from-transparent via-[#d4af37] to-transparent mx-auto mb-3"></div><p class="gold-text text-[13px] font-bold">Developed by E- Mutawakil Sadik</p><p class="text-[9px] opacity-30 mt-1 tracking-widest">PRO MAX v8.2 • 2025/2026</p></div>
</div>

<div id="mainApp" class="hidden max-w-[560px] mx-auto bg-white min-h-screen shadow-xl pb-24 relative">
<div class="bg-[#0b2a5a] text-white p-4 rounded-b-[26px]">
<div class="flex justify-between items-center"><h1 id="userRole" class="font-bold text-sm">Admin</h1><div class="flex gap-2"><button onclick="toggleLang()" id="langBtn2" class="bg-[#ffcc00] text-black px-3 py-1 rounded-full text-[10px] font-bold">EN</button><button onclick="logout()" id="logoutBtn" class="bg-red-500 px-3 py-1 rounded-full text-[10px]">خروج</button></div></div>
<div id="classTabs" class="grid grid-cols-4 gap-2 mt-3 text-[11px] text-center"></div>
</div>
<div class="px-2 flex gap-1 overflow-auto text-[10px] font-bold py-3">
<button onclick="tab('students')" id="tb-students" class="tab bg-black text-white px-3 py-2 rounded-full">طلاب</button>
<button onclick="tab('grades')" id="tb-grades" class="tab bg-gray-100 px-3 py-2 rounded-full">درجاتي</button>
<button onclick="tab('subjects')" id="tb-subjects" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">المواد</button>
<button onclick="tab('timetable')" id="tb-timetable" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">الحصص</button>
<button onclick="tab('exams')" id="tb-exams" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">امتحانات</button>
<button onclick="tab('attendance')" id="tb-att" class="tab bg-gray-100 px-3 py-2 rounded-full">حضور</button>
<button onclick="tab('results')" id="tb-results" class="tab bg-gray-100 px-3 py-2 rounded-full">نتيجة</button>
<button onclick="tab('teachers')" id="tb-teachers" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">معلمين</button>
</div>

<div id="view-students" class="p-4"><div class="flex gap-2"><input id="newName" placeholder="اسم الطالب / Student Name" class="flex-1 border p-3 rounded-xl text-sm"><button onclick="addStudent()" class="bg-black text-white px-4 rounded-xl">+</button></div><div id="studentsList" class="mt-4 space-y-2"></div></div>
<div id="view-grades" class="hidden p-4"><div class="p-3 bg-blue-50 rounded-xl text-xs"><b id="mySubject">مادتي</b></div><div id="gradesList" class="mt-4 space-y-2"></div></div>
<div id="view-subjects" class="hidden p-4 space-y-3"><h3 class="font-bold text-sm" id="subTitle">📚 مواد</h3><div class="flex gap-2"><input id="newSub" placeholder="مادة جديدة / New Subject" class="flex-1 border p-2.5 rounded-xl text-sm"><button onclick="addSubject()" id="addSubBtn" class="bg-[#0b2a5a] text-white px-4 rounded-xl text-xs">+ مادة</button></div><div id="subjectsList" class="space-y-2 mt-3"></div></div>
<div id="view-timetable" class="hidden p-4 space-y-3"><h3 class="font-bold text-sm" id="ttTitle">⏰ زمن الحصص</h3><div id="periodsList" class="space-y-2"></div><button onclick="savePeriods()" id="saveTTBtn" class="w-full mt-3 bg-[#0b2a5a] text-white p-3 rounded-xl text-xs">💾 حفظ / Save</button></div>
<div id="view-exams" class="hidden p-4 space-y-3"><h3 class="font-bold text-sm" id="exTitle">📅 جدول الامتحانات</h3><div id="examTable" class="space-y-2"></div><div class="border p-3 rounded-xl space-y-2 bg-slate-50"><select id="examSub" class="w-full border p-2 rounded-lg text-xs"></select><div class="grid grid-cols-2 gap-2"><input id="examDate" type="date" class="border p-2 rounded-lg text-xs"><input id="examTime" type="time" class="border p-2 rounded-lg text-xs"></div><div class="grid grid-cols-2 gap-2"><input id="examRoom" placeholder="القاعة / Room" class="border p-2 rounded-lg text-xs"><input id="examDur" placeholder="المدة / Duration" type="number" class="border p-2 rounded-lg text-xs"></div><button onclick="addExam()" id="addExBtn" class="w-full bg-black text-white p-2.5 rounded-xl text-xs">+ إضافة / Add</button></div></div>
<div id="view-attendance" class="hidden p-4"><div id="attList" class="space-y-2"></div><button onclick="allPresent()" id="allPresentBtn" class="w-full mt-3 bg-green-600 text-white p-3 rounded-xl text-xs">الكل حاضر / All Present</button></div>
<div id="view-results" class="hidden p-4"><div id="rankingList" class="space-y-2"></div></div>
<div id="view-teachers" class="hidden p-4 space-y-3"><input id="tName" placeholder="اسم الأستاذ / Teacher Name" class="w-full border p-2.5 rounded-xl text-sm"><select id="tSub" class="w-full border p-2.5 rounded-xl text-sm mt-2"></select><input id="tPin" placeholder="كود 4 أرقام / 4-digit PIN" class="w-full border p-2.5 rounded-xl text-sm mt-2"><button onclick="addTeacher()" id="addTBtn" class="w-full bg-[#0b2a5a] text-white p-3 rounded-xl">إضافة / Add</button><div id="teachersList" class="mt-4 space-y-2"></div></div>
<div class="absolute bottom-0 left-0 right-0 p-3 text-center border-t bg-white"><p class="gold-text text-[11px] font-bold">Developed by E- Mutawakil Sadik</p></div>
</div>
<div id="resultPrint" class="hidden max-w-[520px] mx-auto bg-white p-4"></div>

<script>
let lang = localStorage.getItem('union_lang')||'ar';
const i18n = {
ar:{enBtn:'ENGLISH', arBtn:'عربي', loginT:'UNION SCHOOL', loginS:'نظام إدارة المدرسة', login:'دخول / Login', enterPin:'ادخل كود الدخول / Enter PIN', logout:'خروج', students:'طلاب', grades:'درجاتي', subjects:'المواد', timetable:'الحصص', exams:'امتحانات', att:'حضور', results:'نتيجة', teachers:'معلمين', allPresent:'الكل حاضر / All Present', save:'💾 حفظ / Save', add:'+ إضافة / Add', addSub:'+ مادة', addT:'إضافة / Add'},
en:{enBtn:'عربي', arBtn:'ENGLISH', loginT:'UNION SCHOOL', loginS:'School Management System', login:'Login / دخول', enterPin:'Enter PIN / ادخل الكود', logout:'Logout', students:'Students', grades:'My Grades', subjects:'Subjects', timetable:'Periods', exams:'Exams', att:'Attendance', results:'Results', teachers:'Teachers', allPresent:'All Present / الكل حاضر', save:'💾 Save / حفظ', add:'+ Add / إضافة', addSub:'+ Subject', addT:'Add / إضافة'}
};
function applyLang(){
let t=i18n[lang];
document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.getElementById('langBtn').textContent=t.enBtn;
document.getElementById('langBtn2').textContent=lang==='ar'?'EN':'AR';
document.getElementById('loginTitle').textContent=t.loginT;
document.getElementById('loginSub').textContent=t.loginS;
document.getElementById('loginBtn').textContent=t.login;
document.getElementById('loginPin').placeholder=t.enterPin;
document.getElementById('logoutBtn').textContent=t.logout;
document.getElementById('tb-students').textContent=t.students;
document.getElementById('tb-grades').textContent=t.grades;
document.getElementById('tb-subjects').textContent=t.subjects;
document.getElementById('tb-timetable').textContent=t.timetable;
document.getElementById('tb-exams').textContent=t.exams;
document.getElementById('tb-att').textContent=t.att;
document.getElementById('tb-results').textContent=t.results;
document.getElementById('tb-teachers').textContent=t.teachers;
document.getElementById('allPresentBtn').textContent=t.allPresent;
document.getElementById('saveTTBtn').textContent=t.save;
document.getElementById('addExBtn').textContent=t.add;
document.getElementById('addSubBtn').textContent=t.addSub;
document.getElementById('addTBtn').textContent=t.addT;
}
function toggleLang(){lang=lang==='ar'?'en':'ar'; localStorage.setItem('union_lang',lang); applyLang();}

let data=JSON.parse(localStorage.getItem('union_v82')||'{}');
if(!data.students) data={students:[], grades:{}, teachers:[], attendance:{}, periods:{}, exams:{}, periodTimes:{}, subjects:{'1':["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"],'2':["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"],'3':["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"],'4-science':["اللغة العربية","اللغة الانجليزية","الرياضيات المتخصصة","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","الحاسوب"],'4-literary':["اللغة العربية","اللغة الانجليزية","الرياضيات الأساسية","التاريخ","الجغرافيا","التربية الاسلامية","الحاسوب","اللغة الفرنسية"]}, settings:{school:"UNION SECONDARY SCHOOL"}};
let currentUser=null, currentClass='1';
function esc(s){let d=document.createElement('div'); d.textContent=s||''; return d.innerHTML;}
function save(){localStorage.setItem('union_v82',JSON.stringify(data))}
function doLogin(){let pin=document.getElementById('loginPin').value.trim(); if(pin==='9999'){currentUser={name:lang==='ar'?'المطور 👑':'Developer 👑',role:'developer',subject:'All'}; startApp(); return;} if(pin==='1234'){currentUser={name:lang==='ar'?'المدير 👨‍💼':'Admin 👨‍💼',role:'admin',subject:'All'}; startApp(); return;} let t=data.teachers.find(x=>x.pin===pin); if(!t) return alert(lang==='ar'?'كود خطأ':'Wrong PIN'); currentUser=t; startApp();}
function startApp(){document.getElementById('login').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('userRole').textContent=currentUser.name; document.getElementById('classTabs').innerHTML=['1','2','3','4'].map(c=>`<button onclick="setClass('${c}')" id="c${c}" class="cbtn bg-white/20 p-2 rounded-xl">${c==='1'?(lang==='ar'?'أولى':'G1'):c==='2'?(lang==='ar'?'ثانية':'G2'):c==='3'?(lang==='ar'?'ثالثة':'G3'):(lang==='ar'?'رابعة':'G4')}</button>`).join(''); let isAdmin=currentUser.role==='admin'||currentUser.role==='developer'; ['tb-subjects','tb-timetable','tb-exams','tb-teachers'].forEach(id=>{document.getElementById(id).classList.toggle('hidden',!isAdmin)}); if(!isAdmin){document.getElementById('mySubject').textContent=(lang==='ar'?'مادتي: ':'My Subject: ')+currentUser.subject; tab('grades');}else tab('students'); setClass('1'); applyLang();}
function logout(){currentUser=null; document.getElementById('mainApp').classList.add('hidden'); document.getElementById('login').classList.remove('hidden');}
function getKey(){return currentClass==='4'? '4-science' : currentClass;}
function setClass(c){currentClass=c; document.querySelectorAll('.cbtn').forEach(b=>b.className='cbtn bg-white/20 p-2 rounded-xl'); let el=document.getElementById('c'+c); if(el) el.className='cbtn bg-white text-[#0b2a5a] p-2 rounded-xl font-bold'; render();}
function tab(t){['students','grades','subjects','timetable','exams','attendance','results','teachers'].forEach(v=>{let el=document.getElementById('view-'+v); if(el) el.classList.add('hidden')}); document.getElementById('view-'+t).classList.remove('hidden'); render();}
function addStudent(){if(currentUser.role==='teacher') return alert('Admin only'); let n=document.getElementById('newName').value.trim().slice(0,40).replace(/[<>"']/g,''); if(n.length<3) return; data.students.push({id:Date.now(),name:n,class:getKey()}); document.getElementById('newName').value=''; save(); render();}
function addTeacher(){let name=document.getElementById('tName').value.trim().slice(0,30).replace(/[<>"']/g,''); let sub=document.getElementById('tSub').value; let pin=document.getElementById('tPin').value.trim(); if(!name||!pin) return; data.teachers.push({name,subject:sub,pin,role:'teacher'}); save(); render();}
function addSubject(){let k=getKey(); let name=document.getElementById('newSub').value.trim().slice(0,30).replace(/[<>"']/g,''); if(!name) return; if(!data.subjects[k]) data.subjects[k]=[]; data.subjects[k].push(name); document.getElementById('newSub').value=''; save(); render();}
function addExam(){let k=getKey(); let sub=document.getElementById('examSub').value; let date=document.getElementById('examDate').value; let time=document.getElementById('examTime').value; let room=document.getElementById('examRoom').value; let dur=document.getElementById('examDur').value; if(!sub||!date||!time) return alert(lang==='ar'?'اكمل البيانات':'Complete'); if(!data.exams[k]) data.exams[k]=[]; data.exams[k].push({sub,date,time,room,dur}); save(); render();}
function savePeriods(){save(); alert(lang==='ar'?'تم الحفظ':'Saved');}
function render(){
let key=getKey(); let subs=data.subjects[key]||[]; let list=data.students.filter(s=>s.class===key);
document.getElementById('tSub').innerHTML=subs.map(s=>`<option>${esc(s)}</option>`).join(''); document.getElementById('examSub').innerHTML=subs.map(s=>`<option>${esc(s)}</option>`).join('');
document.getElementById('studentsList').innerHTML=list.map(s=>`<div class="border p-3 rounded-xl flex justify-between"><span class="font-bold text-sm">${esc(s.name)}</span><span class="text-[10px]">${s.id}</span></div>`).join('')||(lang==='ar'?'لا يوجد':'No students');
document.getElementById('subjectsList').innerHTML=subs.map((s,i)=>`<div class="flex justify-between bg-slate-50 p-2.5 rounded-xl text-xs"><span>${esc(s)}</span><button onclick="data.subjects['${key}'].splice(${i},1); save(); render();" class="text-red-500">X</button></div>`).join('');
let pk='p_'+key; if(!data.periods[pk]) data.periods[pk]={}; if(!data.periodTimes[pk]) data.periodTimes[pk]={};
document.getElementById('periodsList').innerHTML=subs.map(sub=>{let c=data.periods[pk][sub]||4; let t=data.periodTimes[pk][sub]||'08:00'; return `<div class="grid grid-cols-3 gap-2 items-center bg-slate-50 p-2 rounded-xl text-xs"><span class="truncate">${esc(sub)}</span><input type="number" value="${c}" onchange="data.periods['${pk}']['${esc(sub)}']=parseInt(this.value)||4; save();" class="border rounded p-1 text-center"><input type="time" value="${t}" onchange="data.periodTimes['${pk}']['${esc(sub)}']=this.value; save();" class="border rounded p-1 text-center"></div>`;}).join('');
document.getElementById('examTable').innerHTML=(data.exams[key]||[]).map((e,i)=>`<div class="border p-2.5 rounded-xl text-[11px] bg-yellow-50/50"><div class="flex justify-between"><b>${esc(e.sub)}</b><button onclick="data.exams['${key}'].splice(${i},1); save(); render();" class="text-red-500">X</button></div><div class="mt-1 opacity-70">📅 ${esc(e.date)} ⏰ ${esc(e.time)} - ${esc(e.dur||'')}m - ${esc(e.room||'')}</div></div>`).join('')||'';
let mySub=currentUser.role==='teacher'? currentUser.subject : null;
document.getElementById('gradesList').innerHTML=list.map(s=>{
let g=data.grades[s.id]||{};
if(currentUser.role!=='teacher'){
let rows=subs.map(sub=>{let vv=g[sub]||{t1:0,t2:0,f:0}; return `<div class="flex justify-between text-[11px] bg-slate-50 p-2 rounded"><span>${esc(sub)}</span><span>${vv.t1+vv.t2+vv.f}</span></div>`}).join('');
return `<div class="border rounded-xl p-3"><p class="font-bold text-sm">${esc(s.name)}</p><div class="mt-2 space-y-1">${rows}</div></div>`;
}else{
let v=g[mySub]||{t1:0,t2:0,f:0};
return `<div class="border rounded-xl p-3 flex justify-between items-center"><p class="font-bold text-sm">${esc(s.name)}</p><div class="flex gap-1"><input id="t1_${s.id}" type="number" value="${v.t1}" class="w-12 border rounded p-1 text-center text-xs"><input id="t2_${s.id}" type="number" value="${v.t2}" class="w-12 border rounded p-1 text-center text-xs"><input id="f_${s.id}" type="number" value="${v.f}" class="w-12 border rounded p-1 text-center text-xs"><button onclick="saveGrade(${s.id})" class="bg-black text-white px-2 py-1 rounded text-[10px]">${lang==='ar'?'حفظ':'Save'}</button></div></div>`;
}
}).join('');
let today=new Date().toISOString().split('T')[0];
document.getElementById('attList').innerHTML=list.map(s=>{let absent=data.attendance[s.id+'_'+today]===false; return `<div class="border p-3 rounded-xl flex justify-between"><span class="text-sm font-bold">${esc(s.name)}</span><button onclick="toggleAtt(${s.id})" class="px-3 py-1 rounded-full text-xs ${!absent?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${!absent?(lang==='ar'?'حاضر':'Present'):(lang==='ar'?'غائب':'Absent')}</button></div>`;}).join('');
let ranked=list.map(s=>{let g=data.grades[s.id]||{}; let tot=0; subs.forEach(sub=>{let v=g[sub]; if(v) tot+=v.t1+v.t2+v.f;}); return {...s,total:tot, max:subs.length*100};}).sort((a,b)=>b.total-a.total);
document.getElementById('rankingList').innerHTML=`<h3 class="font-bold text-sm">${lang==='ar'?'نتيجة':'Result'} ${key}</h3>`+ranked.map((s,i)=>`<div class="border p-3 rounded-xl flex justify-between mt-2"><div><p class="font-bold text-sm">${i+1}. ${esc(s.name)}</p><p class="text-[10px]">${s.total}/${s.max}</p></div><button onclick="printResult(${s.id})" class="bg-black text-white px-3 py-1 rounded-full text-[10px]">${lang==='ar'?'طباعة':'Print'}</button></div>`).join('');
document.getElementById('teachersList').innerHTML=data.teachers.map(t=>`<div class="border p-2 rounded-xl flex justify-between text-xs"><div><p class="font-bold">${esc(t.name)}</p><p>${esc(t.subject)} - ${esc(t.pin)}</p></div><button onclick="delTeacher('${esc(t.pin)}')" class="text-red-500">X</button></div>`).join('');
}
function saveGrade(sid){let t1=parseInt(document.getElementById('t1_'+sid).value)||0; let t2=parseInt(document.getElementById('t2_'+sid).value)||0; let f=parseInt(document.getElementById('f_'+sid).value)||0; if(!data.grades[sid]) data.grades[sid]={}; data.grades[sid][currentUser.subject]={t1,t2,f}; save(); render();}
function toggleAtt(sid){let k=sid+'_'+new Date().toISOString().split('T')[0]; if(data.attendance[k]===false) delete data.attendance[k]; else data.attendance[k]=false; save(); render();}
function allPresent(){let today=new Date().toISOString().split('T')[0]; data.students.filter(s=>s.class===getKey()).forEach(s=>{delete data.attendance[s.id+'_'+today]}); save(); render();}
function delTeacher(pin){data.teachers=data.teachers.filter(t=>t.pin!==pin); save(); render();}
function printResult(sid){let s=data.students.find(x=>x.id===sid); let key=s.class; let subs=data.subjects[key]||[]; let g=data.grades[sid]||{}; let tot=0; let rows=''; subs.forEach(sub=>{let v=g[sub]||{t1:0,t2:0,f:0}; let m=v.t1+v.t2+v.f; tot+=m; rows+=`<tr><td class="border p-2">${esc(sub)}</td><td class="border text-center">${v.t1||0}</td><td class="border text-center">${v.t2||0}</td><td class="border text-center">${v.f||0}</td><td class="border text-center font-bold">${m}</td></tr>`;}); document.getElementById('mainApp').style.display='none'; let pr=document.getElementById('resultPrint'); pr.classList.remove('hidden'); pr.innerHTML=`<div class="border-2 border-[#0b2a5a] p-4 rounded-xl"><h1 class="font-bold text-center">UNION - ${esc(key)}</h1><p class="mt-3 text-sm">${esc(s.name)} - ${tot}</p><table class="w-full mt-3 text-[10px] border"><tr class="bg-[#0b2a5a] text-white"><th class="p-2">Subject</th><th>30</th><th>30</th><th>40</th><th>100</th></tr>${rows}</table><p class="gold-text text-center mt-6 text-[11px]">Developed by E- Mutawakil Sadik</p></div><div class="mt-4 flex gap-2"><button onclick="backToApp()" class="flex-1 bg-gray-200 p-3 rounded-xl">Back / رجوع</button><button onclick="window.print()" class="flex-1 bg-black text-white p-3 rounded-xl">Print / طباعة</button></div>`;}
function backToApp(){document.getElementById('resultPrint').classList.add('hidden'); document.getElementById('mainApp').style.display='block';}
applyLang();
</script>
</body>
</html>
