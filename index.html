<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Union v8 - Times</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>*{font-family:Tajawal,sans-serif}</style>
</head>
<body class="bg-[#eef2f7]">
<div id="login" class="max-w-[400px] mx-auto min-h-screen flex flex-col justify-center p-6 bg-white">
<h1 class="font-extrabold text-xl text-center">UNION v8</h1>
<div class="mt-6 space-y-3"><input id="loginPin" type="password" placeholder="PIN" class="w-full p-4 border rounded-xl text-center"><button onclick="doLogin()" class="w-full bg-[#0b2a5a] text-white p-4 rounded-xl font-bold">دخول</button></div>
<div class="mt-6 p-3 bg-black text-white rounded-xl text-[11px]">👑 مطور 9999<br>👨‍💼 ادمن 1234<br>👨‍🏫 استاذ بكودو</div>
</div>

<div id="mainApp" class="hidden max-w-[560px] mx-auto bg-white min-h-screen shadow-xl pb-24">
<div class="bg-[#0b2a5a] text-white p-4 rounded-b-[26px]">
<div class="flex justify-between items-center"><h1 id="userRole" class="font-bold text-sm">Admin</h1><button onclick="logout()" class="bg-red-500 px-3 py-1 rounded-full text-[10px]">خروج</button></div>
<div id="classTabs" class="grid grid-cols-4 gap-2 mt-3 text-[11px] text-center"></div>
</div>
<div class="px-2 flex gap-1 overflow-auto text-[10px] font-bold py-3">
<button onclick="tab('students')" class="tab bg-black text-white px-3 py-2 rounded-full">طلاب</button>
<button onclick="tab('grades')" class="tab bg-gray-100 px-3 py-2 rounded-full">درجاتي</button>
<button onclick="tab('subjects')" id="t-subjects" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">المواد</button>
<button onclick="tab('timetable')" id="t-timetable" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">الحصص+زمن</button>
<button onclick="tab('exams')" id="t-exams" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">امتحانات+زمن</button>
<button onclick="tab('attendance')" class="tab bg-gray-100 px-3 py-2 rounded-full">حضور</button>
<button onclick="tab('results')" class="tab bg-gray-100 px-3 py-2 rounded-full">نتيجة عامة</button>
<button onclick="tab('teachers')" id="t-teachers" class="tab bg-gray-100 px-3 py-2 rounded-full hidden">معلمين</button>
</div>

<div id="view-students" class="p-4"><div class="flex gap-2"><input id="newName" placeholder="اسم الطالب" class="flex-1 border p-3 rounded-xl text-sm"><button onclick="addStudent()" class="bg-black text-white px-4 rounded-xl">+</button></div><div id="studentsList" class="mt-4 space-y-2"></div></div>
<div id="view-grades" class="hidden p-4"><div class="p-3 bg-blue-50 rounded-xl text-xs"><b id="mySubject">مادتي</b></div><div id="gradesList" class="mt-4 space-y-2"></div></div>

<div id="view-subjects" class="hidden p-4 space-y-3">
<h3 class="font-bold text-sm">📚 مواد فصل <span id="subClass">1</span></h3>
<div class="flex gap-2"><input id="newSub" placeholder="مادة جديدة" class="flex-1 border p-2.5 rounded-xl text-sm"><button onclick="addSubject()" class="bg-[#0b2a5a] text-white px-4 rounded-xl text-xs">+ مادة</button></div>
<div id="subjectsList" class="space-y-2 mt-3"></div>
</div>

<div id="view-timetable" class="hidden p-4 space-y-3">
<h3 class="font-bold text-sm">⏰ زمن الحصص - فصل <span id="ttClass">1</span> (ادمن+مطور)</h3>
<div class="grid grid-cols-3 gap-2 text-[11px]"><div>المادة</div><div>عدد الحصص</div><div>زمن الحصة</div></div>
<div id="periodsList" class="space-y-2"></div>
<button onclick="savePeriods()" class="w-full mt-3 bg-[#0b2a5a] text-white p-3 rounded-xl text-xs">💾 حفظ الحصص والأزمنة</button>
</div>

<div id="view-exams" class="hidden p-4 space-y-3">
<h3 class="font-bold text-sm">📅 جدول الامتحانات بزمن - فصل <span id="exClass">1</span></h3>
<div id="examTable" class="space-y-2"></div>
<div class="border p-3 rounded-xl space-y-2 bg-slate-50">
<select id="examSub" class="w-full border p-2 rounded-lg text-xs"></select>
<div class="grid grid-cols-2 gap-2"><input id="examDate" type="date" class="border p-2 rounded-lg text-xs"><input id="examTime" type="time" class="border p-2 rounded-lg text-xs"></div>
<div class="grid grid-cols-2 gap-2"><input id="examRoom" placeholder="القاعة" class="border p-2 rounded-lg text-xs"><input id="examDur" placeholder="المدة دقيقة" type="number" class="border p-2 rounded-lg text-xs"></div>
<button onclick="addExam()" class="w-full bg-black text-white p-2.5 rounded-xl text-xs">+ إضافة امتحان</button>
</div>
</div>

<div id="view-attendance" class="hidden p-4"><div id="attList" class="space-y-2"></div><button onclick="allPresent()" class="w-full mt-3 bg-green-600 text-white p-3 rounded-xl text-xs">الكل حاضر</button></div>
<div id="view-results" class="hidden p-4"><div id="rankingList" class="space-y-2"></div></div>
<div id="view-teachers" class="hidden p-4 space-y-3"><input id="tName" placeholder="اسم الأستاذ" class="w-full border p-2.5 rounded-xl text-sm"><select id="tSub" class="w-full border p-2.5 rounded-xl text-sm mt-2"></select><input id="tPin" placeholder="كود 4 أرقام" class="w-full border p-2.5 rounded-xl text-sm mt-2"><button onclick="addTeacher()" class="w-full bg-[#0b2a5a] text-white p-3 rounded-xl">إضافة معلم</button><div id="teachersList" class="mt-4 space-y-2"></div></div>
</div>
<div id="resultPrint" class="hidden max-w-[520px] mx-auto bg-white p-4"></div>

<script>
let data=JSON.parse(localStorage.getItem('union_v8')||'{}');
if(!data.students) data={
students:[], grades:{}, teachers:[], attendance:{}, periods:{}, exams:{}, periodTimes:{},
subjects:{
'1':["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"],
'2':["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"],
'3':["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"],
'4-science':["اللغة العربية","اللغة الانجليزية","الرياضيات المتخصصة","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","الحاسوب"],
'4-literary':["اللغة العربية","اللغة الانجليزية","الرياضيات الأساسية","التاريخ","الجغرافيا","التربية الاسلامية","الحاسوب","اللغة الفرنسية"]
},
settings:{school:"UNION SECONDARY SCHOOL"}
};
let currentUser=null, currentClass='1', currentSec='science';
function esc(s){let d=document.createElement('div'); d.textContent=s||''; return d.innerHTML;}
function save(){localStorage.setItem('union_v8',JSON.stringify(data))}
function doLogin(){
let pin=document.getElementById('loginPin').value.trim();
if(pin==='9999'){currentUser={name:'المطور 👑',role:'developer',subject:'كل المواد'}; startApp(); return;}
if(pin==='1234'){currentUser={name:'المدير 👨‍💼',role:'admin',subject:'كل المواد'}; startApp(); return;}
let t=data.teachers.find(x=>x.pin===pin); if(!t) return alert('كود خطأ'); currentUser=t; startApp();
}
function startApp(){
document.getElementById('login').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden');
document.getElementById('userRole').textContent=currentUser.name;
document.getElementById('classTabs').innerHTML=['1','2','3','4'].map(c=>`<button onclick="setClass('${c}')" id="c${c}" class="cbtn bg-white/20 p-2 rounded-xl">${c==='1'?'أولى':c==='2'?'ثانية':c==='3'?'ثالثة':'رابعة'}</button>`).join('');
let isAdmin=currentUser.role==='admin'||currentUser.role==='developer';
['t-subjects','t-timetable','t-exams','t-teachers'].forEach(id=>{document.getElementById(id).classList.toggle('hidden',!isAdmin)});
if(!isAdmin){document.getElementById('mySubject').textContent='مادتي: '+currentUser.subject; tab('grades');}else tab('students');
setClass('1');
}
function logout(){currentUser=null; document.getElementById('mainApp').classList.add('hidden'); document.getElementById('login').classList.remove('hidden');}
function getKey(){return currentClass==='4'? '4-'+currentSec : currentClass;}
function setClass(c){currentClass=c; document.querySelectorAll('.cbtn').forEach(b=>b.className='cbtn bg-white/20 p-2 rounded-xl'); let el=document.getElementById('c'+c); if(el) el.className='cbtn bg-white text-[#0b2a5a] p-2 rounded-xl font-bold'; render();}
function tab(t){['students','grades','subjects','timetable','exams','attendance','results','teachers'].forEach(v=>{let el=document.getElementById('view-'+v); if(el) el.classList.add('hidden')}); document.getElementById('view-'+t).classList.remove('hidden'); render();}
function addStudent(){if(currentUser.role==='teacher') return alert('Admin فقط'); let n=document.getElementById('newName').value.trim().slice(0,40).replace(/[<>"']/g,''); if(n.length<3) return; data.students.push({id:Date.now(),name:n,class:getKey()}); document.getElementById('newName').value=''; save(); render();}
function addTeacher(){let name=document.getElementById('tName').value.trim().slice(0,30).replace(/[<>"']/g,''); let sub=document.getElementById('tSub').value; let pin=document.getElementById('tPin').value.trim(); if(!name||!pin) return; data.teachers.push({name,subject:sub,pin,role:'teacher'}); save(); render();}
function addSubject(){let k=getKey(); let name=document.getElementById('newSub').value.trim().slice(0,30).replace(/[<>"']/g,''); if(!name) return; if(!data.subjects[k]) data.subjects[k]=[]; data.subjects[k].push(name); document.getElementById('newSub').value=''; save(); render();}
function addExam(){let k=getKey(); let sub=document.getElementById('examSub').value; let date=document.getElementById('examDate').value; let time=document.getElementById('examTime').value; let room=document.getElementById('examRoom').value.slice(0,20); let dur=document.getElementById('examDur').value; if(!sub||!date||!time) return alert('اكمل المادة+التاريخ+الزمن'); if(!data.exams[k]) data.exams[k]=[]; data.exams[k].push({sub,date,time,room,dur}); save(); render();}
function savePeriods(){save(); alert('✅ تم حفظ أزمنة الحصص');}
function render(){
let key=getKey(); let subs=data.subjects[key]||[]; let list=data.students.filter(s=>s.class===key);
document.getElementById('subClass').textContent=key; document.getElementById('ttClass').textContent=key; document.getElementById('exClass').textContent=key;
document.getElementById('tSub').innerHTML=subs.map(s=>`<option>${esc(s)}</option>`).join(''); document.getElementById('examSub').innerHTML=subs.map(s=>`<option>${esc(s)}</option>`).join('');
document.getElementById('studentsList').innerHTML=list.map(s=>`<div class="border p-3 rounded-xl flex justify-between"><span class="font-bold text-sm">${esc(s.name)}</span><span class="text-[10px]">${s.id}</span></div>`).join('')||'لا يوجد';
document.getElementById('subjectsList').innerHTML=subs.map((s,i)=>`<div class="flex justify-between bg-slate-50 p-2.5 rounded-xl text-xs"><span>${esc(s)}</span><button onclick="data.subjects['${key}'].splice(${i},1); save(); render();" class="text-red-500">حذف</button></div>`).join('');
let pk='p_'+key; if(!data.periods[pk]) data.periods[pk]={}; if(!data.periodTimes[pk]) data.periodTimes[pk]={};
document.getElementById('periodsList').innerHTML=subs.map(sub=>{let c=data.periods[pk][sub]||4; let t=data.periodTimes[pk][sub]||'08:00'; return `<div class="grid grid-cols-3 gap-2 items-center bg-slate-50 p-2 rounded-xl text-xs"><span class="truncate">${esc(sub)}</span><input type="number" min="1" max="10" value="${c}" onchange="data.periods['${pk}']['${esc(sub)}']=parseInt(this.value)||4; save();" class="border rounded p-1 text-center"><input type="time" value="${t}" onchange="data.periodTimes['${pk}']['${esc(sub)}']=this.value; save();" class="border rounded p-1 text-center"></div>`;}).join('');
document.getElementById('examTable').innerHTML=(data.exams[key]||[]).map((e,i)=>`<div class="border p-2.5 rounded-xl text-[11px] bg-yellow-50/50"><div class="flex justify-between"><b>${esc(e.sub)}</b><button onclick="data.exams['${key}'].splice(${i},1); save(); render();" class="text-red-500">حذف</button></div><div class="mt-1 opacity-70">📅 ${esc(e.date)} ⏰ ${esc(e.time)} - ${esc(e.dur||60)} دقيقة - قاعة: ${esc(e.room||'-')}</div></div>`).join('')||'<p class="text-[10px] opacity-50">لا يوجد امتحانات</p>';
let mySub=currentUser.role==='teacher'? currentUser.subject : null;
document.getElementById('gradesList').innerHTML=list.map(s=>{
let g=data.grades[s.id]||{};
if(currentUser.role!=='teacher'){
let rows=subs.map(sub=>{let vv=g[sub]||{t1:0,t2:0,f:0}; return `<div class="flex justify-between text-[11px] bg-slate-50 p-2 rounded"><span>${esc(sub)}</span><span>${vv.t1}+${vv.t2}+${vv.f}=${vv.t1+vv.t2+vv.f}</span></div>`}).join('');
return `<div class="border rounded-xl p-3"><p class="font-bold text-sm">${esc(s.name)}</p><div class="mt-2 space-y-1">${rows}</div></div>`;
}else{
let v=g[mySub]||{t1:0,t2:0,f:0};
return `<div class="border rounded-xl p-3 flex justify-between items-center"><div><p class="font-bold text-sm">${esc(s.name)}</p></div><div class="flex gap-1"><input id="t1_${s.id}" type="number" min="0" max="30" value="${v.t1}" class="w-12 border rounded p-1 text-center text-xs"><input id="t2_${s.id}" type="number" min="0" max="30" value="${v.t2}" class="w-12 border rounded p-1 text-center text-xs"><input id="f_${s.id}" type="number" min="0" max="40" value="${v.f}" class="w-12 border rounded p-1 text-center text-xs"><button onclick="saveGrade(${s.id})" class="bg-black text-white px-2 py-1 rounded text-[10px]">حفظ</button></div></div>`;
}
}).join('');
let today=new Date().toISOString().split('T')[0];
document.getElementById('attList').innerHTML=list.map(s=>{let absent=data.attendance[s.id+'_'+today]===false; return `<div class="border p-3 rounded-xl flex justify-between"><span class="text-sm font-bold">${esc(s.name)}</span><button onclick="toggleAtt(${s.id})" class="px-3 py-1 rounded-full text-xs ${!absent?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${!absent?'حاضر':'غائب'}</button></div>`;}).join('');
let ranked=list.map(s=>{let g=data.grades[s.id]||{}; let tot=0; subs.forEach(sub=>{let v=g[sub]; if(v) tot+=v.t1+v.t2+v.f;}); return {...s,total:tot, max:subs.length*100};}).sort((a,b)=>b.total-a.total);
document.getElementById('rankingList').innerHTML=`<h3 class="font-bold text-sm">نتيجة ${key} - ${subs.length} مواد</h3>`+ranked.map((s,i)=>`<div class="border p-3 rounded-xl flex justify-between mt-2"><div><p class="font-bold text-sm">${i+1}. ${esc(s.name)}</p><p class="text-[10px]">${s.total}/${s.max} - ${s.max?Math.round(s.total/s.max*100):0}%</p></div><button onclick="printResult(${s.id})" class="bg-black text-white px-3 py-1 rounded-full text-[10px]">طباعة</button></div>`).join('');
document.getElementById('teachersList').innerHTML=data.teachers.map(t=>`<div class="border p-2 rounded-xl flex justify-between text-xs"><div><p class="font-bold">${esc(t.name)}</p><p>${esc(t.subject)} - ${esc(t.pin)}</p></div><button onclick="delTeacher('${esc(t.pin)}')" class="text-red-500">حذف</button></div>`).join('');
}
function saveGrade(sid){let t1=parseInt(document.getElementById('t1_'+sid).value)||0; let t2=parseInt(document.getElementById('t2_'+sid).value)||0; let f=parseInt(document.getElementById('f_'+sid).value)||0; if(t1>30) t1=30; if(t2>30) t2=30; if(f>40) f=40; if(!data.grades[sid]) data.grades[sid]={}; data.grades[sid][currentUser.subject]={t1,t2,f}; save(); render();}
function toggleAtt(sid){let k=sid+'_'+new Date().toISOString().split('T')[0]; if(data.attendance[k]===false) delete data.attendance[k]; else data.attendance[k]=false; save(); render();}
function allPresent(){let today=new Date().toISOString().split('T')[0]; data.students.filter(s=>s.class===getKey()).forEach(s=>{delete data.attendance[s.id+'_'+today]}); save(); render();}
function delTeacher(pin){data.teachers=data.teachers.filter(t=>t.pin!==pin); save(); render();}
function printResult(sid){let s=data.students.find(x=>x.id===sid); let key=s.class; let subs=data.subjects[key]||[]; let g=data.grades[sid]||{}; let tot=0; let rows=''; subs.forEach(sub=>{let v=g[sub]||{t1:0,t2:0,f:0}; let m=v.t1+v.t2+v.f; tot+=m; rows+=`<tr><td class="border p-2">${esc(sub)}</td><td class="border text-center">${v.t1||0}</td><td class="border text-center">${v.t2||0}</td><td class="border text-center">${v.f||0}</td><td class="border text-center font-bold">${m}</td></tr>`;}); document.getElementById('mainApp').style.display='none'; let pr=document.getElementById('resultPrint'); pr.classList.remove('hidden'); pr.innerHTML=`<div class="border-2 border-[#0b2a5a] p-4 rounded-xl"><h1 class="font-bold text-center">UNION - ${esc(key)}</h1><p class="mt-3 text-sm">الاسم: ${esc(s.name)} - ${tot}/${subs.length*100}</p><table class="w-full mt-3 text-[10px] border"><tr class="bg-[#0b2a5a] text-white"><th class="p-2">المادة</th><th>30</th><th>30</th><th>40</th><th>100</th></tr>${rows}</table></div><div class="mt-4 flex gap-2"><button onclick="backToApp()" class="flex-1 bg-gray-200 p-3 rounded-xl">رجوع</button><button onclick="window.print()" class="flex-1 bg-black text-white p-3 rounded-xl">طباعة</button></div>`;}
function backToApp(){document.getElementById('resultPrint').classList.add('hidden'); document.getElementById('mainApp').style.display='block';}
</script>
</body>
</html>
