<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Union Secondary School - PRO MAX V5</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>*{font-family:Tajawal,sans-serif}canvas{touch-action:none}@media print{.no-print{display:none!important}body{background:#fff} #mainApp{display:none} #resultPrint{display:block!important}}</style>
</head>
<body class="bg-[#eef2f7]">
<div id="mainApp" class="max-w-[520px] mx-auto bg-white min-h-screen shadow-xl pb-24">
<div class="bg-[#0b2a5a] text-white p-5 rounded-b-[26px] relative overflow-hidden">
<div class="flex justify-between items-center">
<div class="flex gap-3 items-center">
<img id="headerLogo" src="https://cdn-icons-png.flaticon.com/512/3976/3976625.png" class="w-12 h-12 rounded-full bg-white p-1 object-cover">
<div><h1 id="headerSchool" class="font-extrabold text-[17px]">UNION SECONDARY SCHOOL</h1><p id="headerYear" class="text-[10px] opacity-70">2025/2026 - FINAL TERM</p></div>
</div>
<button onclick="tab('settings')" class="bg-white/20 px-3 py-1.5 rounded-full text-[10px] no-print">⚙️ الاعدادات</button>
</div>
<div class="grid grid-cols-4 gap-2 mt-4 text-[11px] text-center no-print">
<button onclick="setClass('1')" id="c1" class="cbtn bg-white text-[#0b2a5a] p-2.5 rounded-xl font-bold">أولى</button>
<button onclick="setClass('2')" id="c2" class="cbtn bg-white/20 p-2.5 rounded-xl">ثانية</button>
<button onclick="setClass('3')" id="c3" class="cbtn bg-white/20 p-2.5 rounded-xl">ثالثة</button>
<button onclick="setClass('4')" id="c4" class="cbtn bg-white/20 p-2.5 rounded-xl">رابعة</button>
</div>
<div id="class4type" class="hidden grid grid-cols-2 gap-2 mt-2 no-print">
<button onclick="setSec('science')" id="csci" class="bg-[#ffcc00] text-black p-2 rounded-xl font-bold text-xs">علمي - Science</button>
<button onclick="setSec('literary')" id="clit" class="bg-white/20 p-2 rounded-xl text-xs">أدبي - Literary</button>
</div>
</div>
<div class="p-4 grid grid-cols-3 gap-2 -mt-1">
<div class="bg-blue-50 p-3 rounded-xl text-center"><p class="text-[10px] opacity-60">الطلاب</p><p id="stCount" class="font-bold">0</p></div>
<div class="bg-green-50 p-3 rounded-xl text-center"><p class="text-[10px] opacity-60">نسبة النجاح</p><p id="passRate" class="font-bold">0%</p></div>
<div class="bg-yellow-50 p-3 rounded-xl text-center"><p class="text-[10px] opacity-60">الأول</p><p id="topName" class="font-bold text-[11px] truncate">-</p></div>
</div>
<div class="px-4 flex gap-2 overflow-auto no-print text-[11px] font-bold pb-2">
<button onclick="tab('students')" id="t-students" class="tab bg-black text-white px-4 py-2 rounded-full whitespace-nowrap">الطلاب & الحضور</button>
<button onclick="tab('grades')" id="t-grades" class="tab bg-gray-100 px-4 py-2 rounded-full whitespace-nowrap">الدرجات 14 مادة</button>
<button onclick="tab('timetable')" id="t-timetable" class="tab bg-gray-100 px-4 py-2 rounded-full whitespace-nowrap">الحصص & الامتحانات</button>
<button onclick="tab('results')" id="t-results" class="tab bg-gray-100 px-4 py-2 rounded-full whitespace-nowrap">النتائج & الترتيب</button>
</div>
<div id="view-students" class="p-4">
<div class="flex gap-2 no-print">
<input id="newName" placeholder="اسم الطالب (3-40 حرف)" maxlength="40" class="flex-1 p-3 border rounded-xl bg-slate-50 text-sm">
<button onclick="addStudent()" class="bg-[#0b2a5a] text-white px-5 rounded-xl font-bold">+ إضافة</button>
</div>
<div class="flex gap-2 mt-3 no-print">
<input id="searchSt" oninput="render()" placeholder="بحث..." class="flex-1 p-2.5 border rounded-xl text-xs bg-slate-50">
<button onclick="allPresent()" class="bg-green-600 text-white px-3 rounded-xl text-[11px]">الكل حاضر ✅</button>
</div>
<div id="studentsList" class="mt-4 space-y-3"></div>
</div>
<div id="view-grades" class="hidden p-4">
<div class="flex justify-between items-center gap-2">
<h3 class="font-bold text-xs">درجات <span id="gradeClass">أولى</span> - 14 مادة (30+30+40)</h3>
<select id="studentSelect" onchange="loadGrades()" class="text-xs border p-2 rounded-lg flex-1"></select>
</div>
<div class="mt-3 overflow-auto border rounded-xl"><table class="w-full text-[11px]"><thead class="bg-[#0b2a5a] text-white"><tr><th class="p-2 text-right">المادة</th><th>30</th><th>30</th><th>40</th><th>مجموع</th><th>تقدير</th></tr></thead><tbody id="gradesBody"></tbody></table></div>
<div class="mt-3 p-3 bg-slate-50 rounded-xl text-xs flex justify-between items-center"><span>المجموع: <b id="totalSum">0/1400</b> • <b id="perc">0%</b></span><span id="statusBadge" class="px-2 py-1 rounded-full bg-gray-200">-</span></div>
</div>
<div id="view-timetable" class="hidden p-4 space-y-4">
<div class="border rounded-xl p-3"><h4 class="font-bold text-xs mb-2">📚 عدد الحصص - مسؤول <span id="ttClass">أولى</span></h4><div id="periodsList" class="grid grid-cols-1 gap-2 text-[11px]"></div><button onclick="savePeriods()" class="w-full mt-3 bg-[#0b2a5a] text-white p-2 rounded-xl text-xs no-print">حفظ الحصص</button></div>
<div class="border rounded-xl p-3"><h4 class="font-bold text-xs mb-2">📅 جدول الامتحانات</h4><div id="examTable" class="space-y-1"></div><div class="flex gap-2 mt-2 no-print"><input id="examSub" placeholder="المادة" maxlength="30" class="flex-1 p-2 border rounded-lg text-xs"><input id="examDate" type="date" class="p-2 border rounded-lg text-xs"><button onclick="addExam()" class="bg-black text-white px-3 rounded-lg text-xs">+ إضافة</button></div></div>
</div>
<div id="view-results" class="hidden p-4">
<div id="rankingList" class="space-y-2"></div>
<div id="settingsPanel" class="mt-6 border-t pt-4 no-print"></div>
</div>
<div id="view-settings" class="hidden p-4 space-y-3 no-print">
<h3 class="font-bold text-sm">⚙️ إعدادات شكلية النتيجة - الأدمن</h3>
<div><label class="text-[11px]">اسم المدرسة</label><input id="set_school" class="w-full p-2.5 border rounded-xl text-sm"></div>
<div><label class="text-[11px]">الشعار / Motto</label><input id="set_motto" class="w-full p-2.5 border rounded-xl text-sm"></div>
<div class="grid grid-cols-2 gap-2"><div><label class="text-[11px]">السنة</label><input id="set_year" class="w-full p-2.5 border rounded-xl text-sm"></div><div><label class="text-[11px]">الترم</label><input id="set_term" class="w-full p-2.5 border rounded-xl text-sm"></div></div>
<div><label class="text-[11px]">شعار المدرسة (رفع صورة)</label><input type="file" accept="image/*" onchange="onLogo(this)" class="w-full p-2 border rounded-xl text-xs"><img id="logoPreview" class="w-16 h-16 mt-2 rounded-full border object-cover"></div>
<div><label class="text-[11px]">اسم المدير</label><input id="set_prin" class="w-full p-2.5 border rounded-xl text-sm"></div>
<button onclick="saveSettings()" class="w-full bg-[#0b2a5a] text-white p-3 rounded-xl font-bold">💾 حفظ كل الإعدادات</button>
<div class="mt-4 p-3 bg-red-50 rounded-xl"><button onclick="if(confirm('مسح كل البيانات؟')){localStorage.clear();location.reload()}" class="text-red-600 text-xs font-bold">🗑️ مسح كل بيانات المدرسة</button></div>
</div>
</div>
<div id="resultPrint" class="hidden max-w-[520px] mx-auto bg-white p-4"></div>
<script>
const subjects1=["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"];
let currentClass='1', currentSec='science';
let data=JSON.parse(localStorage.getItem('union_v5')||'{}');
if(!data.students) data={students:[],grades:{},periods:{},exams:{},fees:{},photos:{},signs:{},settings:{school:"UNION SECONDARY SCHOOL",year:"2025/2026",term:"FINAL TERM / THIRD TERM",motto:"KNOWLEDGE • DISCIPLINE • INTEGRITY • EXCELLENCE",logo:"",principal:"Mr. M. Okoro",teacherReport:{},teacherName:{}}};
function esc(s){let d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML;}
function save(){localStorage.setItem('union_v5',JSON.stringify(data)); renderHeader();}
function saveSettings(){let s=data.settings; s.school=(document.getElementById('set_school').value.trim().slice(0,60)||s.school).replace(/[<>"']/g,''); s.motto=document.getElementById('set_motto').value.trim().slice(0,80).replace(/[<>"']/g,'')||s.motto; s.year=document.getElementById('set_year').value.trim().slice(0,20).replace(/[<>"']/g,'')||s.year; s.term=document.getElementById('set_term').value.trim().slice(0,30).replace(/[<>"']/g,'')||s.term; s.principal=document.getElementById('set_prin').value.trim().slice(0,40).replace(/[<>"']/g,'')||s.principal; save(); alert('✅ تم حفظ شكلية النتيجة'); render();}
function onLogo(input){let f=input.files[0]; if(!f) return; if(f.size>1024*1024) return alert('الصورة كبيرة >1MB'); if(!f.type.startsWith('image/')) return alert('ملف غير صالح'); let r=new FileReader(); r.onload=e=>{data.settings.logo=e.target.result; save(); document.getElementById('logoPreview').src=e.target.result;}; r.readAsDataURL(f);}
function onPhoto(id,input){let f=input.files[0]; if(!f) return; if(f.size>800*1024) return alert('صورة كبيرة'); if(!f.type.startsWith('image/')) return alert('ملف غير صالح'); let r=new FileReader(); r.onload=e=>{data.photos[id]=e.target.result; save();}; r.readAsDataURL(f);}
function renderHeader(){let s=data.settings; document.getElementById('headerSchool').innerHTML=esc(s.school); document.getElementById('headerYear').innerHTML=esc(s.year+' - '+s.term); if(s.logo){document.getElementById('headerLogo').src=s.logo; document.getElementById('logoPreview').src=s.logo;} document.getElementById('set_school').value=s.school; document.getElementById('set_motto').value=s.motto; document.getElementById('set_year').value=s.year; document.getElementById('set_term').value=s.term; document.getElementById('set_prin').value=s.principal; document.getElementById('logoPreview').src=s.logo||'https://cdn-icons-png.flaticon.com/512/3976/3976625.png';}
function getKey(){return currentClass==='4'? '4-'+currentSec : currentClass;}
function setClass(c){currentClass=c; document.querySelectorAll('.cbtn').forEach(b=>b.className='cbtn bg-white/20 p-2.5 rounded-xl'); document.getElementById('c'+c).className='cbtn bg-white text-[#0b2a5a] p-2.5 rounded-xl font-bold'; document.getElementById('class4type').classList.toggle('hidden',c!=='4'); document.getElementById('gradeClass').textContent=c==='4'?(currentSec==='science'?'رابعة علمي':'رابعة أدبي'):c==='1'?'أولى':c==='2'?'ثانية':'ثالثة'; document.getElementById('ttClass').textContent=document.getElementById('gradeClass').textContent; render();}
function setSec(s){currentSec=s; document.getElementById('csci').className=s==='science'?'bg-[#ffcc00] text-black p-2 rounded-xl font-bold text-xs':'bg-white/20 p-2 rounded-xl text-xs'; document.getElementById('clit').className=s==='literary'?'bg-[#ffcc00] text-black p-2 rounded-xl font-bold text-xs':'bg-white/20 p-2 rounded-xl text-xs'; setClass('4');}
function addStudent(){let raw=document.getElementById('newName').value.trim(); if(raw.length<3||raw.length>40) return alert('الاسم 3-40 حرف'); if(/[<>"'`]/.test(raw)) return alert('اسم غير صالح'); let n=raw.replace(/[<>"'`]/g,''); let id='U'+Date.now().toString().slice(-5); data.students.push({id,name:n,class:getKey(),present:true}); document.getElementById('newName').value=''; save(); render();}
function delSt(id){if(!confirm('حذف الطالب؟')) return; data.students=data.students.filter(s=>s.id!==id); delete data.grades[id]; delete data.photos[id]; delete data.fees[id]; save(); render();}
function toggleAtt(id){let s=data.students.find(x=>x.id===id); if(s){s.present=!s.present; save(); render();}}
function allPresent(){let k=getKey(); data.students.forEach(s=>{if(s.class===k) s.present=true;}); save(); render();}
function payFee(id,a){if(!data.fees[id]) data.fees[id]={paid:0,total:150000}; data.fees[id].paid=Math.min(data.fees[id].total, data.fees[id].paid+a); save(); render();}
function sendParent(id){let s=data.students.find(x=>x.id===id); let gg=data.grades[id]||{}; let t=0; subjects1.forEach(ss=>{let v=gg[ss]; if(v) t+=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0);}); let msg=encodeURIComponent(`${data.settings.school}\nالطالب: ${s.name}\nالمجموع: ${t}/1400 (${Math.round(t/14)}%)`); window.open(`https://wa.me/?text=${msg}`,'_blank');}
function render(){let key=getKey(); let search=(document.getElementById('searchSt')?.value||'').toLowerCase(); let list=data.students.filter(s=>s.class===key && s.name.toLowerCase().includes(search)); document.getElementById('stCount').textContent=data.students.filter(s=>s.class===key).length; document.getElementById('studentSelect').innerHTML=list.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(''); document.getElementById('studentsList').innerHTML=list.map(s=>{let fee=data.fees[s.id]||{paid:0,total:150000}; let per=Math.min(100, Math.round(fee.paid/fee.total*100)); let photo=data.photos[s.id]||'https://cdn-icons-png.flaticon.com/512/149/149071.png'; return `<div class="border rounded-2xl p-3 flex gap-3 bg-white shadow-sm"><img src="${photo}" class="w-12 h-12 rounded-full object-cover border"><div class="flex-1 min-w-0"><p class="font-bold text-[13px] truncate">${esc(s.name)}</p><p class="text-[10px] opacity-60">${esc(s.id)} • ${esc(s.class)}</p><div class="flex gap-1.5 mt-2 flex-wrap"><label class="bg-slate-100 px-2 py-1 rounded-lg text-[9px] cursor-pointer">📷 صورة<input type="file" accept="image/*" class="hidden" onchange="onPhoto('${esc(s.id)}',this)"></label><button onclick="sendParent('${esc(s.id)}')" class="bg-[#25D366] text-white px-2 py-1 rounded-lg text-[9px]">💬 واتساب</button><button onclick="payFee('${esc(s.id)}',10000)" class="bg-yellow-400 text-black px-2 py-1 rounded-lg text-[9px]">+10k رسوم</button><button onclick="delSt('${esc(s.id)}')" class="bg-red-50 text-red-500 px-2 py-1 rounded-lg text-[9px]">حذف</button></div><div class="mt-2"><div class="bg-gray-100 rounded-full h-1.5"><div class="bg-[#0b2a5a] h-1.5 rounded-full" style="width:${per}%"></div></div><p class="text-[9px] mt-1 opacity-60">الرسوم: ${fee.paid.toLocaleString()} / ${fee.total.toLocaleString()} - ${per}%</p></div></div><div class="flex flex-col gap-1.5"><button onclick="toggleAtt('${esc(s.id)}')" class="text-[11px] px-3 py-1.5 rounded-full font-bold ${s.present?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${s.present?'حاضر':'غائب'}</button><button onclick="printResult('${esc(s.id)}')" class="text-[10px] bg-black text-white px-3 py-1.5 rounded-full">PDF</button></div></div>`;}).join('')||'<p class="text-xs opacity-50 text-center py-8">لا يوجد طلاب - أضف أول طالب</p>'; let allClass=data.students.filter(s=>s.class===key).map(s=>{let g=data.grades[s.id]||{}; let tot=0; subjects1.forEach(sub=>{let v=g[sub]; if(v) tot+=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0);}); return {...s,total:tot};}).sort((a,b)=>b.total-a.total); allClass.forEach((s,i)=>s.rank=i+1); let pass=allClass.filter(s=>s.total>=700).length; document.getElementById('passRate').textContent=allClass.length? Math.round(pass*100/allClass.length)+'%' : '0%'; document.getElementById('topName').textContent=allClass[0]? allClass[0].name.split(' ')[0] : '-'; document.getElementById('rankingList').innerHTML=`<div class="flex justify-between items-center"><h3 class="font-bold text-sm">ترتيب ${document.getElementById('gradeClass').textContent} - تلقائي</h3><button onclick="window.print()" class="bg-[#0b2a5a] text-white px-4 py-2 rounded-xl text-xs no-print">🖨️ طباعة</button></div>`+allClass.map(s=>`<div class="flex justify-between items-center p-3 border rounded-xl ${s.rank===1?'bg-yellow-50 border-yellow-300':''} mt-2"><div class="flex gap-3 items-center"><span class="w-7 h-7 bg-[#0b2a5a] text-white rounded-full flex items-center justify-center text-[11px] font-bold">${s.rank}</span><div><p class="font-bold text-sm">${esc(s.name)}</p><p class="text-[10px] opacity-60">${s.total}/1400 - ${Math.round(s.total/14)}% - ${s.total>=700?'ناجح':'راسب'}</p></div></div><button onclick="printResult('${esc(s.id)}')" class="text-[10px] bg-black text-white px-3 py-1.5 rounded-full no-print">نتيجة</button></div>`).join('')||'<p class="text-xs opacity-50">لا يوجد طلاب</p>'; let pk='p_'+key; if(!data.periods[pk]) data.periods[pk]={}; let phtml=''; subjects1.forEach(sub=>{let v=data.periods[pk][sub]||4; phtml+=`<div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl"><span>${esc(sub)}</span><input type="number" min="1" max="10" value="${v}" onchange="data.periods['${pk}']['${esc(sub)}']=parseInt(this.value)||4; save();" class="w-14 p-1 border rounded-lg text-center"></div>`}); document.getElementById('periodsList').innerHTML=phtml; let ex=data.exams[key]||[]; document.getElementById('examTable').innerHTML=ex.map((e,i)=>`<div class="flex justify-between bg-slate-50 p-2 rounded-lg text-[11px]"><span>${esc(e.sub)} - ${esc(e.date)}</span><button onclick="delExam('${esc(key)}',${i})" class="text-red-500 no-print">حذف</button></div>`).join('')||'<p class="text-[10px] opacity-50">لا يوجد جدول</p>'; if(list[0]) loadGrades();}
function tab(t){['students','grades','timetable','results','settings'].forEach(v=>{let el=document.getElementById('view-'+v); if(el) el.classList.add('hidden'); let bt=document.getElementById('t-'+v); if(bt) bt.className='tab bg-gray-100 px-4 py-2 rounded-full whitespace-nowrap';}); let v=document.getElementById('view-'+t); if(v) v.classList.remove('hidden'); let b=document.getElementById('t-'+t); if(b) b.className='tab bg-black text-white px-4 py-2 rounded-full whitespace-nowrap';}
function loadGrades(){let sid=document.getElementById('studentSelect').value; if(!sid) return; let g=data.grades[sid]||{}; let html=''; subjects1.forEach(sub=>{let v=g[sub]||{t1:'',t2:'',f:''}; let tot=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0); let grade=tot>=90?'A':tot>=80?'B+':tot>=70?'B':tot>=60?'C':tot>=50?'D':'F'; html+=`<tr class="border-b"><td class="p-2 border text-right">${esc(sub)}</td><td class="border text-center"><input type="number" min="0" max="30" value="${v.t1}" onchange="upGrade('${esc(sid)}','${esc(sub)}','t1',this.value)" class="w-12 p-1 border rounded text-center"></td><td class="border text-center"><input type="number" min="0" max="30" value="${v.t2}" onchange="upGrade('${esc(sid)}','${esc(sub)}','t2',this.value)" class="w-12 p-1 border rounded text-center"></td><td class="border text-center"><input type="number" min="0" max="40" value="${v.f}" onchange="upGrade('${esc(sid)}','${esc(sub)}','f',this.value)" class="w-12 p-1 border rounded text-center"></td><td class="border text-center font-bold">${tot}</td><td class="border text-center">${grade}</td></tr>`;}); document.getElementById('gradesBody').innerHTML=html; calcTotal(sid);}
function upGrade(sid,sub,field,val){let num=parseInt(val); if(isNaN(num)) num=0; if(field==='f'){if(num<0) num=0; if(num>40) num=40;} else {if(num<0) num=0; if(num>30) num=30;} if(!data.grades[sid]) data.grades[sid]={}; if(!data.grades[sid][sub]) data.grades[sid][sub]={t1:0,t2:0,f:0}; data.grades[sid][sub][field]=num; save(); loadGrades(); render();}
function calcTotal(sid){let g=data.grades[sid]||{}; let tot=0; subjects1.forEach(sub=>{let v=g[sub]; if(v) tot+=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0);}); let perc=tot? Math.round(tot/14):0; document.getElementById('totalSum').textContent=tot+'/1400'; document.getElementById('perc').textContent=perc+'%'; let badge=document.getElementById('statusBadge'); badge.textContent=tot>=700?'ناجح':'راسب'; badge.className=tot>=700?'px-3 py-1 rounded-full bg-green-100 text-green-700 font-bold':'px-3 py-1 rounded-full bg-red-100 text-red-700 font-bold';}
function savePeriods(){save(); alert('تم حفظ الحصص');}
function addExam(){let sub=document.getElementById('examSub').value.trim().slice(0,30).replace(/[<>"']/g,''); let date=document.getElementById('examDate').value; if(!sub||!date) return alert('اكتب المادة والتاريخ'); let key=getKey(); if(!data.exams[key]) data.exams[key]=[]; if(data.exams[key].length>=20) return alert('الحد 20 مادة'); data.exams[key].push({sub,date:esc(date)}); document.getElementById('examSub').value=''; save(); render();}
function delExam(key,i){data.exams[key].splice(i,1); save(); render();}
function teacherReport(id,val){data.settings.teacherReport[id]=val.slice(0,300).replace(/[<>"']/g,''); save();}
function teacherNameSet(id,val){data.settings.teacherName[id]=val.slice(0,30).replace(/[<>"']/g,''); save();}
function initPad(id){let c=document.getElementById(id); if(!c) return; let ctx=c.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; let d=false; function p(e){let r=c.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top};} c.addEventListener('mousedown',e=>{d=true; let o=p(e); ctx.beginPath(); ctx.moveTo(o.x,o.y);}); c.addEventListener('mousemove',e=>{if(!d) return; let o=p(e); ctx.lineTo(o.x,o.y); ctx.stroke();}); window.addEventListener('mouseup',()=>d=false); c.addEventListener('touchstart',e=>{d=true; let o=p(e); ctx.beginPath(); ctx.moveTo(o.x,o.y); e.preventDefault();},{passive:false}); c.addEventListener('touchmove',e=>{if(!d) return; let o=p(e); ctx.lineTo(o.x,o.y); ctx.stroke(); e.preventDefault();},{passive:false}); c.addEventListener('touchend',()=>d=false);}
function clearSign(who){let c=document.getElementById(who==='teacher'?'signTeacher':'signPrincipal'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);}
function saveSign(who,sid){let c=document.getElementById(who==='teacher'?'signTeacher':'signPrincipal'); let img=c.toDataURL(); if(who==='teacher') data.signs[sid+'_teacher']=img; else data.signs['principal']=img; save(); alert('✅ تم حفظ الإمضاء');}
function printResult(id){let s=data.students.find(x=>x.id===id); if(!s) return; let set=data.settings; let key=s.class; let g=data.grades[id]||{}; let ranked=data.students.filter(x=>x.class===key).map(x=>{let gg=data.grades[x.id]||{}; let t=0; subjects1.forEach(ss=>{let v=gg[ss]; if(v) t+=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0);}); return {...x,total:t};}).sort((a,b)=>b.total-a.total); let rank=ranked.findIndex(x=>x.id===id)+1; let tot=0; let rows=''; subjects1.forEach(sub=>{let v=g[sub]||{t1:0,t2:0,f:0}; let tt=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0); tot+=tt; let grade=tt>=90?'A':tt>=80?'B+':tt>=70?'B':tt>=60?'C':tt>=50?'D':'F'; rows+=`<tr><td class="p-2 border text-right">${esc(sub)}</td><td class="border text-center">${v.t1||0}</td><td class="border text-center">${v.t2||0}</td><td class="border text-center">${v.f||0}</td><td class="border text-center font-bold">${tt}</td><td class="border text-center">${grade}</td></tr>`;}); let report=set.teacherReport[id]||""; let tName=set.teacherName[key]||"مسؤول الفصل"; document.getElementById('mainApp').style.display='none'; document.getElementById('resultPrint').classList.remove('hidden'); document.getElementById('resultPrint').innerHTML=`<div class="border-[2px] border-[#0b2a5a] p-4 rounded-xl bg-white"><div class="flex gap-3 items-center border-b-2 border-[#0b2a5a] pb-3"><img src="${set.logo||'https://cdn-icons-png.flaticon.com/512/3976/3976625.png'}" class="w-14 h-14 rounded-full object-cover border"><div class="flex-1 text-center"><h1 class="font-extrabold text-[16px]">${esc(set.school)}</h1><p class="text-[9px]">${esc(set.motto)}</p><p class="text-[9px] font-bold mt-1">${esc(set.year)} - ${esc(set.term)}</p><p class="font-bold text-[11px] mt-1">شهادة نتيجة</p></div></div><div class="grid grid-cols-2 gap-2 mt-3 text-[11px] bg-slate-50 p-3 rounded-xl"><div><p><b>الاسم:</b> ${esc(s.name)}</p><p><b>الرقم:</b> ${esc(s.id)}</p><p><b>الفصل:</b> ${esc(key)}</p></div><div><p><b>المجموع:</b> ${tot}/1400</p><p><b>النسبة:</b> ${Math.round(tot/14)}%</p><p><b>الترتيب:</b> ${rank} من ${ranked.length} - <span class="${tot>=700?'text-green-700':'text-red-600'} font-bold">${tot>=700?'ناجح':'راسب'}</span></p></div></div><table class="w-full mt-3 text-[10px] border"><thead class="bg-[#0b2a5a] text-white"><tr><th class="p-2 border text-right">المادة</th><th class="border">30</th><th class="border">30</th><th class="border">40</th><th class="border">100</th><th class="border">تقدير</th></tr></thead><tbody>${rows}</tbody></table><div class="mt-3 border rounded-xl p-3 bg-yellow-50/60"><p class="font-bold text-[11px]">📝 تقرير أستاذ الفصل:</p><textarea id="repInput" onchange="teacherReport('${esc(id)}',this.value)" placeholder="اكتب تقرير الاستاذ هنا..." class="w-full mt-2 p-2 border rounded-lg text-[11px] no-print" rows="3">${esc(report)}</textarea><p class="text-[11px] mt-1">${esc(report)||'لا يوجد تقرير'}</p><div class="mt-2"><label class="text-[10px]">اسم مسؤول الفصل:</label><input value="${esc(tName)}" onchange="teacherNameSet('${esc(key)}',this.value)" class="w-full p-1.5 border rounded-lg text-[11px] no-print" placeholder="اسم الاستاذ"><p class="text-[10px] mt-1 font-bold">${esc(tName)}</p></div></div><div class="mt-5 grid grid-cols-2 gap-6"><div class="border rounded-xl p-2 text-center"><p class="font-bold text-[11px]">✍️ إمضاء مسؤول الفصل</p><canvas id="signTeacher" width="220" height="90" class="border rounded-lg w-full mt-2 bg-white"></canvas><div class="flex gap-2 mt-2 no-print"><button onclick="clearSign('teacher')" class="flex-1 bg-gray-100 p-1.5 rounded-lg text-[10px]">مسح</button><button onclick="saveSign('teacher','${esc(id)}')" class="flex-1 bg-black text-white p-1.5 rounded-lg text-[10px]">حفظ</button></div><div class="mt-2 h-14 flex items-center justify-center">${data.signs[id+'_teacher']?`<img src="${data.signs[id+'_teacher']}" class="h-12 object-contain">`:'<span class="text-[9px] opacity-40">لا يوجد إمضاء</span>'}</div><p class="text-[10px] mt-1">${esc(tName)}</p></div><div class="border rounded-xl p-2 text-center"><p class="font-bold text-[11px]">✍️ إمضاء المدير</p><canvas id="signPrincipal" width="220" height="90" class="border rounded-lg w-full mt-2 bg-white"></canvas><div class="flex gap-2 mt-2 no-print"><button onclick="clearSign('principal')" class="flex-1 bg-gray-100 p-1.5 rounded-lg text-[10px]">مسح</button><button onclick="saveSign('principal','${esc(id)}')" class="flex-1 bg-[#0b2a5a] text-white p-1.5 rounded-lg text-[10px]">حفظ</button></div><div class="mt-2 h-14 flex items-center justify-center">${data.signs['principal']?`<img src="${data.signs['principal']}" class="h-12 object-contain">`:'<span class="text-[9px] opacity-40">لا يوجد إمضاء</span>'}</div><p class="text-[10px] mt-1">${esc(set.principal)}</p></div></div></div><div class="mt-4 flex gap-2 no-print"><button onclick="backToApp()" class="flex-1 bg-gray-100 p-3 rounded-xl font-bold">رجوع</button><button onclick="window.print()" class="flex-1 bg-[#0b2a5a] text-white p-3 rounded-xl font-bold">🖨️ طباعة النتيجة</button></div>`; setTimeout(()=>{initPad('signTeacher'); initPad('signPrincipal');},300);}
function backToApp(){document.getElementById('resultPrint').classList.add('hidden'); document.getElementById('mainApp').style.display='block'; render();}
renderHeader(); setClass('1'); tab('students');
</script>
</body>
