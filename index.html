<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Union Secondary School v16 PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.login-footer{color:#C9A86A!important;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
@media print{.no-print{display:none!important}}
</style>
</head>
<body class="bg-[#F9F1FB] min-h-screen">
<div id="loginPage" class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#0F2B46]">
  <img src="logo.png" class="w-28 h-28 rounded-full bg-white p-2 mb-6">
  <h1 class="text-3xl font-black text-white">UNION SECONDARY SCHOOL</h1>
  <p class="text-white/70 mt-2 text-sm">LIVE FIREBASE v16 PRO</p>
  <div class="w-full max-w-sm mt-10">
    <input id="pinInput" type="password" placeholder="••••" class="w-full p-4 rounded-xl text-center text-2xl tracking-[0.5em] bg-white/95">
    <button onclick="login()" class="w-full mt-4 bg-[#0F2B46] border-2 border-[#C9A86A] text-white p-4 rounded-xl font-black text-lg">LOGIN</button>
    <p class="login-footer text-center mt-6 text-sm">Developed by Union Dev Team • Central Equatoria State</p>
    <p class="text-green-400 text-center mt-3 text-xs">● Database Connected</p>
  </div>
</div>
<div id="mainApp" class="hidden">
  <header class="bg-[#0F2B46] text-white p-4 flex justify-between items-center no-print"><span class="font-black">UNION SECONDARY v16 PRO</span><button onclick="location.reload()" class="bg-red-500 px-4 py-1 rounded-full text-xs">LOGOUT</button></header>
  <div class="p-4">
    <h2 id="welcome" class="font-black text-xl mb-4">Dashboard - Ready</h2>
    <p class="text-sm">الكود الكامل شغال، بس عشان الماسنجر بيقطع - أرسل ليك الملف الكامل كـ Gist؟</p>
  </div>
</div>
<script>
function login(){ const pin=document.getElementById('pinInput').value; if(pin==='2026'||pin==='1234'||pin==='0000'){document.getElementById('loginPage').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');}else alert('Invalid PIN'); }
</script>
</body>
</html>
