<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Union School - AR/EN</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>*{font-family:Tajawal,sans-serif}canvas{touch-action:none}@media print{.no-print{display:none!important}}</style>
</head>
<body class="bg-[#eef2f7]">
<div id="mainApp" class="max-w-[520px] mx-auto bg-white min-h-screen shadow-xl pb-24">
<div class="bg-[#0b2a5a] text-white p-5 rounded-b-[26px]">
<div class="flex justify-between items-center">
<h1 id="schoolName" class="font-extrabold text-[15px]">UNION SECONDARY SCHOOL</h1>
<div class="flex gap-2">
<button onclick="toggleLang()" id="langBtn" class="bg-white text-[#0b2a5a] px-3 py-1 rounded-full text-[11px] font-bold">EN</button>
<button onclick="tab('settings')" class="bg-white/20 px-3 py-1 rounded-full text-[10px]">⚙️</button>
</div>
</div>
<div class="grid grid-cols-4 gap-2 mt-4 text-[11px] text-center">
<button onclick="setClass('1')" id="c1" class="cbtn bg-white text-[#0b2a5a] p-2 rounded-xl font-bold">أولى</button>
<button onclick="setClass('2')" id="c2" class="cbtn bg-white/20 p-2 rounded-xl">ثانية</button>
<button onclick="setClass('3')" id="c3" class="cbtn bg-white/20 p-2 rounded-xl">ثالثة</button>
<button onclick="setClass('4')" id="c4" class="cbtn bg-white/20 p-2 rounded-xl">رابعة</button>
</div>
</div>

<div class="px-4 flex gap-2 overflow-auto text-[11px] font-bold py-3 no-print">
<button onclick="tab('students')" id="t-students" class="tab bg-black text-white px-4 py-2 rounded-full">الطلاب</button>
<button onclick="tab('grades')" id="t-grades" class="tab bg-gray-100 px-4 py-2 rounded-full">الدرجات</button>
<button onclick="tab('results')" id="t-results" class="tab bg-gray-100 px-4 py-2 rounded-full">النتائج</button>
</div>

<div id="view-students" class="p-4">
<div class="flex gap-2"><input id="newName" placeholder="اسم الطالب / Student Name" maxlength="40" class="flex-1 p-3 border rounded-xl bg-slate-50 text-sm"><button onclick="addStudent()" class="bg-[#0b2a5a] text-white px-5 rounded-xl font-bold">+</button></div>
<div id="studentsList" class="mt-4 space-y-3"></div>
</div>

<div id="view-grades" class="hidden p-4">
<div class="flex gap-2"><select id="studentSelect" onchange="loadGrades()" class="flex-1 border p-2 rounded-xl text-sm"></select></div>
<div class="mt-3 overflow-auto border rounded-xl"><table class="w-full text-[11px]"><thead class="bg-[#0b2a5a] text-white"><tr><th class="p-2 text-right" id="th-sub">المادة</th><th>30</th><th>30</th><th>40</th><th id="th-total">مجموع</th></tr></thead><tbody id="gradesBody"></tbody></table></div>
<div class="mt-3 p-3 bg-slate-50 rounded-xl text-xs"><span id="totalLabel">المجموع:</span> <b id="totalSum">0/1400</b> • <b id="perc">0%</b></div>
</div>

<div id="view-results" class="hidden p-4"><div id="rankingList" class="space-y-2"></div></div>
<div id="view-settings" class="hidden p-4"><input id="set_school" class="w-full p-2 border rounded-xl"><button onclick="saveSettings()" class="w-full mt-2 bg-[#0b2a5a] text-white p-3 rounded-xl">حفظ / Save</button></div>
</div>

<div id="resultPrint" class="hidden max-w-[520px] mx-auto bg-white p-4"></div>

<script>
let lang = localStorage.getItem('union_lang')||'ar';
const dict={
ar:{students:"الطلاب & الحضور",grades:"الدرجات 14 مادة",results:"النتائج & الترتيب",sub:"المادة",total:"مجموع",sum:"المجموع:",pass:"ناجح",fail:"راسب",first:"أولى",second:"ثانية",third:"ثالثة",fourth:"رابعة",add:"إضافة",search:"بحث...",present:"حاضر",absent:"غائب",print:"طباعة النتيجة",delete:"حذف"},
en:{students:"Students & Attendance",grades:"Grades - 14 Subjects",results:"Results & Ranking",sub:"Subject",total:"Total",sum:"Total:",pass:"Pass",fail:"Fail",first:"Grade 1",second:"Grade 2",third:"Grade 3",fourth:"Grade 4",add:"Add",search:"Search...",present:"Present",absent:"Absent",print:"Print Result",delete:"Delete"}
};
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('union_lang',lang);applyLang()}
function applyLang(){
let d=dict[lang];
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.getElementById('langBtn').textContent=lang==='ar'?'EN':'عربي';
document.getElementById('t-students').textContent=d.students;
document.getElementById('t-grades').textContent=d.grades;
document.getElementById('t-results').textContent=d.results;
document.getElementById('th-sub').textContent=d.sub;
document.getElementById('th-total').textContent=d.total;
document.getElementById('totalLabel').textContent=d.sum;
document.getElementById('c1').textContent=d.first;document.getElementById('c2').textContent=d.second;document.getElementById('c3').textContent=d.third;document.getElementById('c4').textContent=d.fourth;
render();
}

const subjects_ar=["اللغة العربية","اللغة الانجليزية","الرياضيات","الفيزياء","الكيمياء","الاحياء","التربية الاسلامية","التاريخ","الجغرافيا","الحاسوب","التربية الوطنية","اللغة الفرنسية","العلوم العسكرية","التربية الفنية"];
const subjects_en=["Arabic","English","Mathematics","Physics","Chemistry","Biology","Islamic","History","Geography","Computer","National","French","Military","Art"];
let currentClass='1';
let data=JSON.parse(localStorage.getItem('union_v5')||'{}');
if(!data.students) data={students:[],grades:{},settings:{school:"UNION SECONDARY SCHOOL"}};
function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function save(){localStorage.setItem('union_v5',JSON.stringify(data))}
function saveSettings(){data.settings.school=document.getElementById('set_school').value.slice(0,60).replace(/[<>"']/g,'');save();alert('Saved');}
function setClass(c){currentClass=c;document.querySelectorAll('.cbtn').forEach(b=>b.className='cbtn bg-white/20 p-2 rounded-xl');document.getElementById('c'+c).className='cbtn bg-white text-[#0b2a5a] p-2 rounded-xl font-bold';render()}
function addStudent(){let n=document.getElementById('newName').value.trim().slice(0,40).replace(/[<>"']/g,'');if(n.length<3)return alert('Name too short');data.students.push({id:Date.now(),name:n,class:currentClass,present:true});document.getElementById('newName').value='';save();render()}
function delSt(id){data.students=data.students.filter(s=>s.id!=id);delete data.grades[id];save();render()}
function render(){let key=currentClass;let list=data.students.filter(s=>s.class==key);document.getElementById('studentSelect').innerHTML=list.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');document.getElementById('studentsList').innerHTML=list.map(s=>`<div class="border rounded-xl p-3 flex justify-between"><span class="font-bold text-sm">${esc(s.name)}</span><div class="flex gap-2"><button onclick="printResult(${s.id})" class="bg-black text-white px-3 py-1 rounded-full text-[10px]">${dict[lang].print}</button><button onclick="delSt(${s.id})" class="bg-red-50 text-red-500 px-2 py-1 rounded-full text-[10px]">${dict[lang].delete}</button></div></div>`).join('')||'';if(list[0])loadGrades();let ranked=list.map(s=>{let g=data.grades[s.id]||{};let t=0;subjects_ar.forEach(sub=>{let v=g[sub];if(v)t+=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0)});return{...s,total:t}}).sort((a,b)=>b.total-a.total);document.getElementById('rankingList').innerHTML=ranked.map((s,i)=>`<div class="border p-3 rounded-xl flex justify-between"><span>${i+1}. ${esc(s.name)} - ${s.total}/1400</span><span class="${s.total>=700?'text-green-600':'text-red-600'}">${s.total>=700?dict[lang].pass:dict[lang].fail}</span></div>`).join('')}
function tab(t){['students','grades','results','settings'].forEach(v=>{let el=document.getElementById('view-'+v);if(el)el.classList.add('hidden')});document.getElementById('view-'+t).classList.remove('hidden')}
function loadGrades(){let sid=document.getElementById('studentSelect').value;if(!sid)return;let g=data.grades[sid]||{};let html='';let subs=lang==='ar'?subjects_ar:subjects_en;subs.forEach((sub,idx)=>{let keyAr=subjects_ar[idx];let v=g[keyAr]||{t1:0,t2:0,f:0};let tot=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0);html+=`<tr class="border-b"><td class="p-2 border">${sub}</td><td class="border text-center"><input type="number" min="0" max="30" value="${v.t1}" onchange="up(${sid},'${keyAr}','t1',this.value)" class="w-12 border rounded text-center"></td><td class="border text-center"><input type="number" min="0" max="30" value="${v.t2}" onchange="up(${sid},'${keyAr}','t2',this.value)" class="w-12 border rounded text-center"></td><td class="border text-center"><input type="number" min="0" max="40" value="${v.f}" onchange="up(${sid},'${keyAr}','f',this.value)" class="w-12 border rounded text-center"></td><td class="border text-center font-bold">${tot}</td></tr>`});document.getElementById('gradesBody').innerHTML=html;calc(sid)}
function up(sid,sub,f,v){let n=parseInt(v)||0;if(f=='f'){if(n>40)n=40}else if(n>30)n=30;if(n<0)n=0;if(!data.grades[sid])data.grades[sid]={};if(!data.grades[sid][sub])data.grades[sid][sub]={t1:0,t2:0,f:0};data.grades[sid][sub][f]=n;save();loadGrades()}
function calc(sid){let g=data.grades[sid]||{};let tot=0;subjects_ar.forEach(s=>{let v=g[s];if(v)tot+=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0)});document.getElementById('totalSum').textContent=tot+'/1400';document.getElementById('perc').textContent=Math.round(tot/14)+'%'}
function printResult(id){let s=data.students.find(x=>x.id==id);let g=data.grades[id]||{};let tot=0;let rows='';let subs=lang==='ar'?subjects_ar:subjects_en;subs.forEach((sub,idx)=>{let keyAr=subjects_ar[idx];let v=g[keyAr]||{t1:0,t2:0,f:0};let m=(parseInt(v.t1)||0)+(parseInt(v.t2)||0)+(parseInt(v.f)||0);tot+=m;rows+=`<tr><td class="border p-2">${sub}</td><td class="border text-center">${v.t1||0}</td><td class="border text-center">${v.t2||0}</td><td class="border text-center">${v.f||0}</td><td class="border text-center font-bold">${m}</td></tr>`});document.getElementById('mainApp').style.display='none';let pr=document.getElementById('resultPrint');pr.classList.remove('hidden');pr.innerHTML=`<h1 class="font-extrabold text-center">${esc(data.settings.school)}<br><span class="text-xs">2025/2026 - ${tot>=700?dict[lang].pass:dict[lang].fail}</span></h1><p class="mt-4 text-sm">${esc(s.name)} - ${tot}/1400 (${Math.round(tot/14)}%)</p><table class="w-full mt-3 text-xs border"><tr class="bg-[#0b2a5a] text-white"><th class="p-2">${dict[lang].sub}</th><th>30</th><th>30</th><th>40</th><th>100</th></tr>${rows}</table><div class="mt-6 flex gap-2 no-print"><button onclick="location.reload()" class="flex-1 bg-gray-200 p-3 rounded-xl">رجوع / Back</button><button onclick="window.print()" class="flex-1 bg-black text-white p-3 rounded-xl">Print</button></div>`}
applyLang();setClass('1');
</script>
</body>
</html>
